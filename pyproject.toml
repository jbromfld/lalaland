[project]
name = "lalaland"
version = "0.1.0"
description = "Local-first research briefing agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.136",
    "uvicorn~=0.49",
    "temporalio~=1.32",
    "requests~=2.34",
    "beautifulsoup4~=4.14",
    "feedparser~=6.0",
    "psycopg[binary]~=3.3",
    "opentelemetry-api~=1.42",
    "opentelemetry-sdk~=1.42",
    "opentelemetry-exporter-otlp-proto-http~=1.42",
    "langsmith~=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
